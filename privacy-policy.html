<!DOCTYPE html>
<html lang="en" data-bs-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Privacy Policy – SimpliciTees </title>

    <!-- Bootstrap 6 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <!-- Custom-style CSS -->
    <link href="styles/custom-style.css" rel="stylesheet">
</head>

<!-- d-flex + flex-column + min-vh-100 lets the footer stick to the bottom on short pages -->
<body class="d-flex flex-column min-vh-100">

    <!-- 
    ============================= NAVBAR =============================

    sticky-top = keeps the navbar fixed at the top of the viewport when scrolling 
    md:navbar-expand = navbar expands on medium screens and larger,
    collapses into a hamburger menu on smaller screens

    -->
    <nav class="navbar md:navbar-expand sticky-top">
        <div class="container-fluid px-11 py-4">
            <a class="navbar-brand" href="index.html">
                <img class="display-light" src="images/logos/secondary_light.png" alt="SimpliciTees Logo Light">
                <img class="display-dark" src="images/logos/secondary_dark.png" alt="SimpliciTees Logo Dark">
            </a>
            
            <!-- Navbar Hamburger Button -->
            <button class="btn-icon navbar-toggler" type="button"
                    data-bs-toggle="drawer" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button> 
            
            <!-- Navbar drawer - appears when the navbar hamburger button is clicked -->
            <dialog class="drawer drawer-end" tabindex="-1" id="mainNav" aria-labelledby="mainNavLabel">
                <div class="drawer-header">
                    <h4 class="drawer-title" id="mainNavLabel">Menu</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                
                
                <!-- Navbar drawer content (Replace # with respective html file) -->
                <div class="drawer-body">
                    <ul class="nav navbar-nav md:ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <!-- ============================= HERO ============================= -->
    <header class="general-hero hero-query position-relative d-flex align-items-center overflow-hidden">
        
        <!-- Foreground -->
        <div class="general-hero-foreground container-fluid px-4 md:px-11 py-5 md:py-12 position-relative z-2 text-center">
            <h1 class="ppo-hero-title fw-semibold pb-4 md:pb-6"> Privacy Policy </h1>
            <p class="ppo-hero-description fw-semibold text-uppercase mb-0"> Last Updated: October 10, 2026 </p>
        </div>

    </header>

    <!-- Bootstrap 6 JS -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    
    <!-- 
    Automatically detects and applies the user's preferred light/dark theme 
    Also updates theme-dependent elements based on the user's system preference
    -->
    <script src="js/usertheme.js"></script>
</body>
</html>
